[server]
http_port = 3000
domain = localhost
root_url = http://localhost:3000

[security]
admin_user = admin
allow_sign_up = false

[users]
allow_sign_up = false
default_theme = dark

[analytics]
reporting_enabled = false

[log]
mode = console
level = info

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/home.json
